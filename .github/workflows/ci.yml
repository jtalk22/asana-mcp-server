name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - name: Syntax
        run: node --check src/server.js && node --check src/cli.js
      - name: Unit tests
        run: npm test
      - name: CLI smoke (no token needed)
        run: |
          node src/cli.js --version
          node src/cli.js --tools | wc -l
          ASANA_MCP_TOOLS=read node src/cli.js --tools | wc -l

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.x'
          cache: 'npm'
      - run: npm ci
      - name: Version parity
        run: node scripts/check-version-parity.js
      - name: Public wording + estate-leak guard
        run: bash scripts/check-public-language.sh
